# Autoformer M4 Weekly setup from exps/phase4_tfts/autoformer.
benchmark:
  metrics: [mae, mse, rmse, smape]
  runs: 1
  epochs: 10
  batch_size: 16
  learning_rate: 0.001
  output_dir: benchmark_results/exps_autoformer

models:
  autoformer:
    config:
      kernel_size: 25
      hidden_size: 512
      num_layers: 2
      num_decoder_layers: 1
      num_attention_heads: 8
      ffn_intermediate_size: 2048
      hidden_dropout_prob: 0.1
      attention_probs_dropout_prob: 0.1
      skip_connect_circle: true
    training:
      loss: smape
      early_stopping_patience: 3

datasets:
  m4_weekly_exps:
    type: m4
    data_dir: exps/dataset/m4
    seasonal_pattern: Weekly
    train_length: 26
    predict_sequence_length: 13
    windows_per_series: 1
    window_seed: 2026
