[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | docs/build/
  | node_modules/
  | venve/
  | .venv/
)
'''

[tool.nbqa.mutate]
isort = 1
black = 1

[project]
name = "tfts"
dynamic = ["version"]
description = "Deep learning time series with TensorFlow"
readme = "README.md"
requires-python = ">=3.8,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Longxing Tan" }]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pandas>=1.3.0",
    "tensorflow>=2.4",
]

[project.optional-dependencies]
benchmark = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://time-series-prediction.readthedocs.io"
Documentation = "https://time-series-prediction.readthedocs.io"
Repository = "https://github.com/LongxingTan/Time-series-prediction"

[project.scripts]
tfts-forecast = "tfts.cli.forecasting:main"
tfts-benchmark = "benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tfts", "benchmark"]

[dependency-groups]
dev = [
    "black[jupyter]==24.8.0",
    "coverage",
    "flake8==5.0.4",
    "invoke",
    "ipykernel",
    "ipywidgets>=8.0.1",
    "isort==5.10.1",
    "mypy",
    "nbqa",
    "pre-commit>=2.20.0",
    "pyarrow>=10.0.0",
    "pylint",
]
docs = [
    "cloudpickle",
    "docutils",
    "ipython",
    "matplotlib",
    "nbconvert>=6.3.0",
    "nbsphinx",
    "optuna>=2.0",
    "pandoc",
    "pydata-sphinx-theme",
    "recommonmark",
    "scikit-learn>0.23",
    "sphinx>3.2",
    "sphinx-autobuild",
    "sphinx-markdown-tables",
]
release = ["hatch-vcs", "hatchling"]
test = ["coverage"]

[tool.hatch.version]
source = "vcs"

[build-system]  # make the package pip installable
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
