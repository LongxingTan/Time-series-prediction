name: Lint

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  linter-black:
      name: Check code formatting with Black
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Install uv
          uses: astral-sh/setup-uv@v6
          with:
            version: "0.6.17"
            python-version: "3.8"
            enable-cache: true
        - name: Install dependencies
          run: uv sync --frozen --only-group dev
        - name: Run Black
          run: uv run --no-sync black --check tfts examples tests

  imports-check-isort:
    name: Check valid import formatting with isort
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: "3.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dev
      - name: Run isort
        run: uv run --no-sync isort --check-only --diff .

  linter-flake8:
    name: Check valid formatting with flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: "3.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dev
      - name: Run checks
        run: uv run --no-sync flake8

  pre-commit-hooks:
    name: Check that pre-commit hooks pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: "3.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --only-group dev
      - name: Run checks
        run: uv run --no-sync pre-commit run --all-files
