# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: PyPi Release

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The dynamic-versioning plugin reads the Git tag to determine the package version.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: '3.12'
          enable-cache: true

      - name: Install release tooling
        run: uv sync --frozen --only-group release

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(uv run --no-sync hatchling version)"
          test "$actual_version" = "$expected_version"
          echo "Building tfts $actual_version"

      - name: Build
        run: |
          uv build --python .venv/bin/python --no-build-isolation

      - name: Publish distribution 📦 to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish
