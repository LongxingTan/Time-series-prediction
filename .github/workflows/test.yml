# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.8'
            tf-version: '2.13.1'
          - os: ubuntu-22.04
            python-version: '3.9'
            tf-version: '2.13.1'
          - os: ubuntu-22.04
            python-version: '3.11'
            tf-version: '2.13.1'
          - os: ubuntu-22.04
            python-version: '3.11'
            tf-version: '2.15.1'
          - os: ubuntu-24.04
            python-version: '3.12'
            tf-version: '2.16.2'
          - os: ubuntu-24.04
            python-version: '3.13'
            tf-version: '2.21.0'
          - os: macos-15-intel
            python-version: '3.9'
            tf-version: '2.15.1'
          - os: macos-15-intel
            python-version: '3.11'
            tf-version: '2.16.2'
          - os: macos-15
            python-version: '3.11'
            tf-version: '2.20.0'
          - os: macos-15
            python-version: '3.13'
            tf-version: '2.21.0'
          - os: windows-2022
            python-version: '3.13'
            tf-version: '2.21.0'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python -m pip install poetry==1.8.5
          else
            curl -sSL https://install.python-poetry.org | python3 - --version 1.8.5
          fi
      - name: Set poetry path variable
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure poetry
        shell: bash
        run: poetry config virtualenvs.in-project true

      - name: Check for healthy virtualenv manually
        shell: bash
        run: |
          if [ -d .venv ]; then
            poetry run pip --version >/dev/null 2>&1 || rm -rf .venv
          fi

      - name: Install dependencies
        shell: bash
        run: |
          poetry run python -m pip install pip -U
          # Install the tooling from the lock file, but let pip select the
          # TensorFlow wheel for this OS/architecture and matrix version.
          poetry install --only dev --no-interaction --no-root
          if [[ "${{ matrix.tf-version }}" == "2.13.1" ]]; then
            # TensorFlow 2.13.1 requires typing-extensions<4.6, while mypy
            # requires typing-extensions>=4.6. Mypy is not used by this job.
            poetry run python -m pip uninstall --yes mypy
          fi
          poetry run python -m pip install --upgrade --force-reinstall \
            "tensorflow==${{ matrix.tf-version }}" \
            "pandas>=1.3" \
            matplotlib
          if [[ "${{ matrix.python-version }}" == "3.8" && "${{ matrix.tf-version }}" == "2.13.1" ]]; then
            # jsonschema 4.23.0 needs this dependency on Python <3.9, but
            # Poetry 1.8.5 does not include it from the lock metadata.
            poetry run python -m pip install "pkgutil-resolve-name>=1.3.10"
          fi
          poetry run python -m pip check

      - name: Print runtime versions
        shell: bash
        run: |
          poetry run python -c "import platform, sys, tensorflow as tf; print(sys.version); print(platform.platform()); print('TensorFlow', tf.__version__)"

      - name: Run unittest
        shell: bash
        run: poetry run coverage run -m unittest discover -s ./tests  -p 'test_*.py'

      - name: Statistics
        if: success()
        run: |
          poetry run coverage report -i
          poetry run coverage xml -i

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          flags: cpu, unittest
          name: CPU-coverage
          fail_ci_if_error: false

  package:
    name: Build package on Python 3.14
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install package build tools
        run: python -m pip install --upgrade pip build
      - name: Compile package sources
        run: python -m compileall -q tfts
      - name: Build wheel
        run: python -m build --wheel

  docs:
    name: Test docs build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create pip cache directory manually
        run: |
          CACHE_DIR="$HOME/.cache/pip"
          mkdir -p "$CACHE_DIR"
          echo "Using manual pip cache at $CACHE_DIR"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          pip install -r docs/requirements_docs.txt
        shell: bash

      - name: Build sphinx documentation
        run: |
          cd docs
          make clean
          make html --debug --jobs 2 SPHINXOPTS=""

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-results-${{ runner.os }}-py3.12
          path: docs/build/html/
        # Use always() to always run this step to publish test results when there are test failures
        if: success()
