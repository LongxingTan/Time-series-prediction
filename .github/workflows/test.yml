# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.8'
            tf-version: '2.13.1'
          - os: ubuntu-22.04
            python-version: '3.9'
            tf-version: '2.13.1'
          - os: ubuntu-22.04
            python-version: '3.11'
            tf-version: '2.13.1'
          - os: ubuntu-22.04
            python-version: '3.11'
            tf-version: '2.15.1'
          - os: ubuntu-24.04
            python-version: '3.12'
            tf-version: '2.16.2'
          - os: ubuntu-24.04
            python-version: '3.13'
            tf-version: '2.21.0'
          - os: macos-15-intel
            python-version: '3.9'
            tf-version: '2.15.1'
          - os: macos-15-intel
            python-version: '3.11'
            tf-version: '2.16.2'
          - os: macos-15
            python-version: '3.11'
            tf-version: '2.20.0'
          - os: macos-15
            python-version: '3.13'
            tf-version: '2.21.0'
          - os: windows-2022
            python-version: '3.13'
            tf-version: '2.21.0'

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          # Install test tooling from uv.lock, but let pip select the
          # TensorFlow wheel for this OS/architecture and matrix version.
          uv sync --frozen --only-group test
          uv pip install --upgrade --force-reinstall \
            "tensorflow==${{ matrix.tf-version }}" \
            "pandas>=1.3" \
            "PyYAML>=5.4" \
            matplotlib
          if [[ "${{ matrix.python-version }}" == "3.8" && "${{ matrix.tf-version }}" == "2.13.1" ]]; then
            # jsonschema 4.23.0 needs this dependency on Python <3.9.
            uv pip install "pkgutil-resolve-name>=1.3.10"
          fi
          uv pip install --no-deps --editable .
          uv pip check

      - name: Print runtime versions
        shell: bash
        run: |
          uv run --no-sync python -c "import platform, sys, tensorflow as tf; print(sys.version); print(platform.platform()); print('TensorFlow', tf.__version__)"

      - name: Run unittest
        shell: bash
        run: uv run --no-sync coverage run -m unittest discover -s ./tests -p 'test_*.py'

      - name: Statistics
        if: success()
        run: |
          uv run --no-sync coverage report -i
          uv run --no-sync coverage xml -i

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          flags: cpu, unittest
          name: CPU-coverage
          fail_ci_if_error: false

  package:
    name: Build package on Python 3.14
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: '3.14'
          enable-cache: true
      - name: Compile package sources
        run: uv run --no-project python -m compileall -q tfts
      - name: Build wheel
        run: |
          uv sync --frozen --only-group release
          uv build --python .venv/bin/python --no-build-isolation --wheel

  docs:
    name: Test docs build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          uv sync --frozen --no-dev --group docs
        shell: bash

      - name: Build sphinx documentation
        run: |
          cd docs
          uv run --no-sync make clean
          uv run --no-sync make html --debug --jobs 2 SPHINXOPTS=""

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-results-${{ runner.os }}-py3.11
          path: docs/build/html/
        # Use always() to always run this step to publish test results when there are test failures
        if: success()
